<style>
/* Layout: full-bleed WebGL stage; title cartouche top-left, shot label top-right, command bar on the bottom edge */
:root {
  --night: #0c0a17;
  --ink: #f4ead6;
  --ink-dim: #c9b9a0;
  --gold: #e9b860;
  --ember: #ff7b2e;

}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-rows: auto 1fr auto; z-index: 3;
}
.bars::before, .bars::after {
  content: ""; position: fixed; left: 0; right: 0; height: 7vh; background: #000; z-index: 2;
  transition: transform .9s cubic-bezier(.7,0,.2,1); pointer-events: none;
}
.bars::before { top: 0; }
.bars::after { bottom: 0; }
.bars.off::before { transform: translateY(-100%); }
.bars.off::after { transform: translateY(100%); }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.title { max-width: 30rem; text-shadow: 0 2px 18px rgba(0,0,0,.65); }
.eyebrow {
  font-family: var(--display); font-weight: 500; font-size: .72rem; letter-spacing: .32em;
  text-transform: uppercase; color: var(--gold); margin: 0 0 .35rem;
}
h1 {

  color: var(--ink); text-align: right; padding-top: .3rem; opacity: 0; transform: translateY(-6px);

}

.bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  font-size: .85rem; color: var(--ink-dim); font-style: italic; text-shadow: 0 1px 8px rgba(0,0,0,.9);
  transition: opacity .6s;
}
.commands {
  pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  padding: 8px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3);

}

  background: rgba(255,255,255,.04); border: 1px solid rgba(233,184,96,.22); border-radius: 9px;
  padding: .7rem .85rem; display: inline-flex; align-items: center; gap: .5rem; cursor: pointer;
  transition: background .2s, border-color .2s, transform .15s, color .2s;
}

.loader {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
  background: radial-gradient(120% 90% at 50% 100%, #3a1a1a 0%, #170f22 45%, var(--night) 100%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

.loader h2 {

.status code { font-style: normal; color: var(--ink); font-size: .9em; }
.err .progress { display: none; }
.loader button { pointer-events: auto; }

@media (max-width: 640px) {
  .cmd kbd { display: none; }
  .cmd { padding: .6rem .65rem; font-size: .66rem; letter-spacing: .1em; }
  .sub { font-size: .88rem; }
  .shot { display: none; }
  .bars::before, .bars::after { height: 4vh; }
}
@media (prefers-reduced-motion: reduce) {
  .bars::before, .bars::after, .shot, .loader { transition: none; }
}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Model setup. The Meshy model is normalised so that it looks along +Z with
// the wings spread along X; everything below is expressed in that frame.
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const num = (k, d) => (params.has(k) ? parseFloat(params.get(k)) : d);
const MODEL = {
  url: params.get('model') || 'assets/dragon.glb',
  yaw: num('yaw', 0),          // radians, turns the raw model so the head points to +Z
  pitch: num('pitch', 0),
  length: num('len', 17),      // longest horizontal side in world units
  wingRoot: num('wroot', 0.2), // fraction of the half span where the wing starts to bend
  wingElbow: num('welbow', 0.58),
  shoulderY: num('wy', 0.15),  // fraction of the height above the centre
  tailZ: num('tail', -0.3),    // fraction of the half length where the tail starts to sway
  neckZ: num('neck', 0.38),    // fraction of the half length where the neck starts
  flip: params.has('flip'),    // mirror Z if the model flies backwards
};
const DEBUG = params.has('debug');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------------------
// Atmosphere constants (linear colour space)
// ---------------------------------------------------------------------------
const SUN = new THREE.Vector3(-0.62, 0.21, -0.77).normalize();
const FOG_COL = new THREE.Color(0.3, 0.15, 0.22);
const SUN_FOG = new THREE.Color(1.3, 0.55, 0.2);
const FOG_D = 0.0011;
const v3 = (v) => `vec3(${v.x.toFixed(4)}, ${v.y.toFixed(4)}, ${v.z.toFixed(4)})`;
const c3 = (c) => `vec3(${c.r.toFixed(4)}, ${c.g.toFixed(4)}, ${c.b.toFixed(4)})`;

// Fog that glows toward the sun: patched into every built-in material.
THREE.ShaderChunk.fog_pars_vertex = '#ifdef USE_FOG\n varying float vFogDepth; varying vec3 vFogDir;\n#endif';
THREE.ShaderChunk.fog_vertex = '#ifdef USE_FOG\n vFogDepth = -mvPosition.z; vFogDir = mvPosition.xyz * mat3(viewMatrix);\n#endif';
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
  uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogDir;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear; uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
  #else
    float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
  #endif
  float fogSun = pow(max(dot(normalize(vFogDir), ${v3(SUN)}), 0.0), 7.0);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, mix(fogColor, ${c3(SUN_FOG)}, fogSun), fogFactor);
#endif`;

const NOISE_GLSL = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*vnoise(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }
vec3 fogTint(vec3 dir){ return mix(${c3(FOG_COL)}, ${c3(SUN_FOG)}, pow(max(dot(dir, ${v3(SUN)}), 0.0), 7.0)); }
`;

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function makeNoise(seed) {
  const rand = mulberry32(seed), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  return (x, y, z) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(lerp(lerp(grad(p[AA] & 15, x, y, z), grad(p[BA] & 15, x - 1, y, z), u),
      lerp(grad(p[AB] & 15, x, y - 1, z), grad(p[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[AA + 1] & 15, x, y, z - 1), grad(p[BA + 1] & 15, x - 1, y, z - 1), u),
        lerp(grad(p[AB + 1] & 15, x, y - 1, z - 1), grad(p[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  };
}
const fbm = (n, x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s; };
const srgb = (hex) => new THREE.Color(hex); // Color(hex) converts sRGB hex into the linear working space
function paint(geo, color) {
  const c = color.isColor ? color : srgb(color), n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return geo;
}
function floatAttr(attr) {
  const out = new Float32Array(attr.count * attr.itemSize), get = ['getX', 'getY', 'getZ', 'getW'];
  for (let i = 0; i < attr.count; i++) for (let k = 0; k < attr.itemSize; k++) out[i * attr.itemSize + k] = attr[get[k]](i);
  return new THREE.BufferAttribute(out, attr.itemSize);
}

// ---------------------------------------------------------------------------
// Renderer, scene, camera, post-processing
// ---------------------------------------------------------------------------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COL.clone(), FOG_D);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.3, 6000);
camera.position.set(0, 40, 160);

const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.6, 1.25);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uHeat: { value: 0 }, uFlash: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uHeat, uFlash; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float d = dot(c, c);
      vec2 off = c * d * 0.018;
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, col * vec3(0.9, 0.96, 1.1), (1.0 - l) * 0.35);
      col = mix(col, col * vec3(1.05, 1.0, 0.9), l * 0.3);
      col += vec3(1.0, 0.42, 0.12) * uHeat * 0.08 + uFlash;
      col *= mix(1.0, 0.5, smoothstep(0.1, 0.65, d * 1.7));
      col += (h(vUv * uRes + fract(uTime) * 91.7) - 0.5) * 0.035;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(grade);

// Lights
const sun = new THREE.DirectionalLight(srgb('#ffd2a1'), 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 200 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(srgb('#8e86c9'), srgb('#7a4636'), 0.9);
scene.add(hemi);
const fill = new THREE.DirectionalLight(srgb('#8fa6ff'), 0.7);
fill.position.set(0.5, 0.4, 0.8).multiplyScalar(100);
scene.add(fill);

// ---------------------------------------------------------------------------
// Sky dome + environment map
// ---------------------------------------------------------------------------
function skyMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `
      uniform float uTime; varying vec3 vDir;
      ${NOISE_GLSL}
      void main(){
        vec3 d = normalize(vDir); float h = d.y, hp = max(h, 0.0);
        float sd = max(dot(d, ${v3(SUN)}), 0.0);
        vec3 zenith = vec3(0.01, 0.018, 0.07), upper = vec3(0.085, 0.045, 0.15), horizon = vec3(1.0, 0.34, 0.1);
        vec3 col = mix(horizon, upper, smoothstep(0.0, 0.3, hp));
        col = mix(col, zenith, smoothstep(0.22, 0.85, hp));
        col += vec3(1.0, 0.36, 0.08) * pow(sd, 5.0) * 0.9 * (1.0 - smoothstep(0.0, 0.45, hp));
        col += vec3(1.0, 0.55, 0.25) * pow(sd, 48.0) * 0.9;
        col += vec3(1.0, 0.82, 0.55) * smoothstep(0.9990, 0.9995, sd) * 30.0;

const DEFORM_GLSL = `
uniform float uFlap, uFlap2, uTime, uTailAmp, uNeckPitch, uNeckYaw;
uniform vec4 uWing; // halfSpan, rootX, elbowX, shoulderY
uniform vec4 uBody; // halfLen, tailZ, neckZ, neckY

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + DEFORM_GLSL)
      .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n vec3 dPos = position; dragonDeform(dPos, objectNormal);')
      .replace('#include <begin_vertex>', 'vec3 transformed = dPos;');

      .replace('#include <common>', '#include <common>\nvarying vec3 vDW;')
      .replace('#include <color_fragment>', '#include <color_fragment>\n' + (DEBUG ? 'diffuseColor.rgb = mix(diffuseColor.rgb, vDW, 0.7);' : ''));

function dragonDepthMaterial() {

    Object.assign(shader.uniforms, rig.uniforms);

      .replace('#include <begin_vertex>', 'vec3 transformed = position; vec3 dN = vec3(0.0, 1.0, 0.0); dragonDeform(transformed, dN);');

async function loadDragon(onProgress) {
  const gltf = await new GLTFLoader().loadAsync(MODEL.url, onProgress);
  const src = gltf.scene;
  src.rotation.set(MODEL.pitch, MODEL.yaw, 0);
  if (MODEL.flip) src.scale.z = -1;
  src.updateMatrixWorld(true);
  const meshes = [];
  src.traverse((o) => { if (o.isMesh) meshes.push(o); });
  const geos = meshes.map((m) => {
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal', 'uv']) if (m.geometry.attributes[name]) g.setAttribute(name, floatAttr(m.geometry.attributes[name]));
    if (m.geometry.index) g.setIndex(m.geometry.index.clone());
    g.applyMatrix4(m.matrixWorld);
    if (!g.attributes.normal) g.computeVertexNormals();
    g.computeBoundingBox();
    return g;
  });
  const box = new THREE.Box3();
  geos.forEach((g) => box.union(g.boundingBox));
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const s = MODEL.length / Math.max(size.x, size.z);
  const norm = new THREE.Matrix4().makeScale(s, s, s).multiply(new THREE.Matrix4().makeTranslation(-center.x, -center.y, -center.z));
  const depthMat = dragonDepthMaterial();
  meshes.forEach((m, i) => {
    const g = geos[i].applyMatrix4(norm);
    if (MODEL.flip) g.index && g.index.array.reverse();
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    mats.forEach((mat) => { mat.envMapIntensity = 1.1; patchDragonMaterial(mat); });
    const mesh = new THREE.Mesh(g, m.material);
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.customDepthMaterial = depthMat;
    mesh.frustumCulled = false;
    body.add(mesh);
  });
  rig.halfSpan = (size.x * s) / 2;
  rig.halfLen = (size.z * s) / 2;
  rig.height = size.y * s;
  // Mouth: the frontmost geometry near the centre line. Rider: the highest point over the back.
  const p = new THREE.Vector3(), mouthAcc = new THREE.Vector3(), riderAcc = new THREE.Vector3();
  let maxZ = -Infinity, mouthN = 0, riderTop = -Infinity, riderZ = 0;
  const each = (fn) => body.children.forEach((m) => { const a = m.geometry.attributes.position; for (let i = 0; i < a.count; i += 3) fn(p.fromBufferAttribute(a, i)); });
  each((v) => { if (Math.abs(v.x) < rig.halfSpan * 0.14 && v.z > maxZ) maxZ = v.z; });
  each((v) => {
    if (Math.abs(v.x) < rig.halfSpan * 0.14 && v.z > maxZ - rig.halfLen * 0.07) { mouthAcc.add(v); mouthN++; }
    if (Math.abs(v.x) < rig.halfSpan * 0.12 && Math.abs(v.z) < rig.halfLen * 0.3 && v.y > riderTop) { riderTop = v.y; riderZ = v.z; }
  });
  rig.mouth.copy(mouthAcc.divideScalar(Math.max(mouthN, 1)));
  if (params.has('mouth')) rig.mouth.fromArray(params.get('mouth').split(',').map(Number));
  rig.rider.set(0, riderTop, riderZ);
  const shoulderY = rig.height * MODEL.shoulderY;
  rig.uniforms.uWing.value.set(rig.halfSpan, rig.halfSpan * MODEL.wingRoot, rig.halfSpan * MODEL.wingElbow, shoulderY);
  rig.uniforms.uBody.value.set(rig.halfLen, rig.halfLen * MODEL.tailZ, rig.halfLen * MODEL.neckZ, rig.mouth.y * 0.4);
  rig.ready = true;
}

function particleSystem({ count, blend, vert, frag }) {
  const pos = new Float32Array(count * 3), vel = new Float32Array(count * 3), life = new Float32Array(count).fill(2), max = new Float32Array(count);

  aPos.setUsage(THREE.DynamicDrawUsage); aLife.setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('position', aPos); g.setAttribute('aLife', aLife);
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1)); g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uPx: { value: 1 }, uTime: { value: 0 } }, transparent: true, depthWrite: false,
    vertexShader: vert, fragmentShader: frag,
    ...(blend === 'add' ? { blending: THREE.AdditiveBlending }
      : blend === 'premul' ? { blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor }
      : { blending: THREE.NormalBlending }),
  });
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  let cursor = 0;
  return {
    mat,
    emit(p, v, lifeSpan, sz) {
      const i = cursor; cursor = (cursor + 1) % count;
      pos.set([p.x, p.y, p.z], i * 3); vel.set([v.x, v.y, v.z], i * 3);
      life[i] = 0; max[i] = lifeSpan; size[i] = sz; seed[i] = Math.random();
      g.attributes.aSize.needsUpdate = g.attributes.aSeed.needsUpdate = true;
    },
    update(dt, drag, lift, turb = 0) {
      const k = Math.exp(-drag * dt);
      for (let i = 0; i < count; i++) {
        if (life[i] >= max[i]) { aLife.array[i] = 2; continue; }
        life[i] += dt;
        const j = i * 3;
        vel[j] = vel[j] * k + (Math.random() - 0.5) * turb * dt; vel[j + 1] = vel[j + 1] * k + lift * dt + (Math.random() - 0.5) * turb * dt; vel[j + 2] = vel[j + 2] * k + (Math.random() - 0.5) * turb * dt;
        pos[j] += vel[j] * dt; pos[j + 1] += vel[j + 1] * dt; pos[j + 2] += vel[j + 2] * dt;
        aLife.array[i] = life[i] / max[i];
      }
      aPos.needsUpdate = aLife.needsUpdate = true;
    },
  };
}
const PARTICLE_VERT = `
  attribute float aLife, aSize, aSeed; uniform float uPx; varying float vLife, vSeed;
  void main(){
    vLife = aLife; vSeed = aSeed;

    float grow = mix(0.5, 2.6, sqrt(clamp(aLife, 0.0, 1.0)));

    ${NOISE_GLSL}

  const count = 60, rand = mulberry32(3), seg = new Float32Array(count * 6), data = [];

// Sound, synthesised with Web Audio (off until the viewer turns it on)
// ---------------------------------------------------------------------------
const sound = {
  ctx: null, on: false,
  init() {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return false;
    const ctx = (this.ctx = new C());
    this.master = ctx.createGain(); this.master.gain.value = 0.8;
    const comp = ctx.createDynamicsCompressor(); this.master.connect(comp).connect(ctx.destination);
    const len = ctx.sampleRate * 3;
    this.brown = ctx.createBuffer(1, len, ctx.sampleRate); this.white = ctx.createBuffer(1, len, ctx.sampleRate);
    const b = this.brown.getChannelData(0), w = this.white.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const r = Math.random() * 2 - 1; w[i] = r; last = (last + 0.02 * r) / 1.02; b[i] = last * 3.5; }
    const wind = ctx.createBufferSource(); wind.buffer = this.brown; wind.loop = true;
    this.windFilter = ctx.createBiquadFilter(); this.windFilter.type = 'lowpass'; this.windFilter.frequency.value = 500;
    this.windGain = ctx.createGain(); this.windGain.gain.value = 0;
    wind.connect(this.windFilter).connect(this.windGain).connect(this.master); wind.start();
    return true;
  },
  toggle() {
    if (!this.ctx && !this.init()) return false;
    this.on = !this.on;
    if (this.on) this.ctx.resume();
    this.master.gain.setTargetAtTime(this.on ? 0.8 : 0, this.ctx.currentTime, 0.1);
    return this.on;
  },
  burst(buffer, type, freq, q, peak, attack, release, rate = 1) {
    if (!this.on) return null;
    const ctx = this.ctx, t = ctx.currentTime, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buffer; src.playbackRate.value = rate; src.loop = true;
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0005, t + attack + release);
    src.connect(f).connect(g).connect(this.master); src.start(t, Math.random() * 2); src.stop(t + attack + release + 0.05);
    return f;
  },
  flap(strength) { this.burst(this.brown, 'lowpass', 160, 0.7, 0.9 * strength, 0.06, 0.45); },
  fire(dur) {
    const f = this.burst(this.white, 'bandpass', 700, 0.6, 0.55, 0.15, dur);
    if (f) { f.frequency.setValueAtTime(400, this.ctx.currentTime); f.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + dur * 0.5); }
    this.burst(this.brown, 'lowpass', 300, 1, 0.8, 0.1, dur);
    this.burst(this.white, 'highpass', 4000, 0.5, 0.12, 0.2, dur, 0.5);
  },
  roar() {
    if (!this.on) return;
    const ctx = this.ctx, t = ctx.currentTime, out = ctx.createGain(), shaper = ctx.createWaveShaper(), lp = ctx.createBiquadFilter();
    const curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = (i / 512) - 1; curve[i] = Math.tanh(x * 4); }
    shaper.curve = curve; lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(1300, t + 0.5); lp.frequency.linearRampToValueAtTime(350, t + 2.2);
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.5, t + 0.25); out.gain.setValueAtTime(0.5, t + 1.3); out.gain.exponentialRampToValueAtTime(0.0005, t + 2.4);
    shaper.connect(lp).connect(out).connect(this.master);
    [58, 87, 116, 61].forEach((f0, i) => {
      const o = ctx.createOscillator(); o.type = i === 3 ? 'square' : 'sawtooth';
      o.frequency.setValueAtTime(f0 * 0.8, t); o.frequency.linearRampToValueAtTime(f0 * 1.15, t + 0.45); o.frequency.linearRampToValueAtTime(f0 * 0.7, t + 2.3);
      const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 23 + i * 4; vg.gain.value = f0 * 0.06;
      vib.connect(vg).connect(o.frequency); o.connect(shaper); o.start(t); vib.start(t); o.stop(t + 2.5); vib.stop(t + 2.5);
    });
    this.burst(this.white, 'bandpass', 900, 0.8, 0.35, 0.2, 2.0);
  },
};

const state = {
  t: 0, u: 0.0, speed: 30, bank: 0, flapPhase: 0, flapAmp: 1, prevSin: 0,
  fire: { t: -1, dur: 3.2 }, roll: { t: -1, dur: 1.9, dir: 1 }, roar: { t: -1, dur: 2.6 },
  shake: 0, heat: 0, flash: 0,
};
const BREATH_CHARGE = 0.55;
function doFire() { if (state.fire.t < 0 && rig.ready) { state.fire.t = 0; sound.fire(state.fire.dur - BREATH_CHARGE); pulse('bFire', state.fire.dur); } }
function doRoll() { if (state.roll.t < 0) { state.roll.t = 0; state.roll.dir = Math.random() < 0.5 ? -1 : 1; pulse('bRoll', state.roll.dur); } }
function doRoar() { if (state.roar.t < 0 && rig.ready) { state.roar.t = 0; sound.roar(); pulse('bRoar', state.roar.dur); } }
function pulse(id, dur) { const b = document.getElementById(id); b.classList.add('busy'); setTimeout(() => b.classList.remove('busy'), dur * 1000); }

const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), dummy = new THREE.Object3D();
const Xd = new THREE.Vector3(), Yd = new THREE.Vector3(), Zd = new THREE.Vector3(), Zf = new THREE.Vector3(), Xf = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
const mouthW = new THREE.Vector3(), mouthDir = new THREE.Vector3(), mouthLocal = new THREE.Vector3(), mouthTip = new THREE.Vector3();
const prevMouth = new THREE.Vector3();

function updateDragon(dt) {
  const s = state;
  s.u = (s.u + (s.speed * dt) / PATH_LEN) % 1;
  const pos = path.getPointAt(s.u), T = path.getTangentAt(s.u);
  const T2 = path.getTangentAt((s.u + 0.004) % 1);
  const curv = tmpV.copy(T2).sub(T).divideScalar(0.004 * PATH_LEN);
  s.speed = damp(s.speed, 30 - T.y * 22, 1.5, dt);
  dummy.position.copy(pos);
  dummy.up.copy(UP);
  dummy.lookAt(tmpV2.copy(pos).add(T));
  const left = tmpV2.set(1, 0, 0).applyQuaternion(dummy.quaternion);
  const targetBank = -Math.atan((curv.dot(left) * s.speed * s.speed) / 26);
  s.bank = damp(s.bank, clamp(targetBank, -1.0, 1.0), 2.5, dt);
  dummy.rotateZ(s.bank);
  dragon.position.copy(pos);
  dragon.quaternion.slerp(dummy.quaternion, 1 - Math.exp(-6 * dt));

  // maneuvers
  let roll = 0, pitch = 0, neckPitch = 0, neckYaw = Math.sin(s.t * 0.37) * 0.12, flapBoost = 0, glide = 0;
  if (s.roll.t >= 0) {
    s.roll.t += dt;
    const k = clamp(s.roll.t / s.roll.dur, 0, 1);
    roll = ease(k) * Math.PI * 2 * s.roll.dir;
    glide = Math.sin(k * Math.PI);
    if (k >= 1) s.roll.t = -1;
  }
  if (s.roar.t >= 0) {
    s.roar.t += dt;
    const k = s.roar.t;
    const env = smoothstep01(k / 0.35) * (1 - smoothstep01((k - 1.7) / 0.8));
    neckPitch += 0.45 * env; pitch -= 0.18 * env; flapBoost = env;
    if (k > 0.25 && k < 1.6) s.shake = Math.max(s.shake, 0.9);
    shock.visible = k < 1.6;
    if (shock.visible && rig.ready) {
      const r = smoothstep01((k - 0.25) / 1.3);
      body.localToWorld(deformPoint(rig.mouth, mouthLocal));
      shock.position.copy(mouthLocal);
      shock.lookAt(camera.position);
      shock.scale.setScalar(1 + r * 46);
      shock.material.uniforms.uA.value = (1 - r) * 0.5 * smoothstep01((k - 0.25) / 0.1);
    }
    if (k >= s.roar.dur) { s.roar.t = -1; shock.visible = false; }
  }
  let breathing = false;
  if (s.fire.t >= 0) {
    s.fire.t += dt;
    const k = s.fire.t;
    if (k < BREATH_CHARGE) { neckPitch += 0.25 * smoothstep01(k / BREATH_CHARGE); }
    else { breathing = k < s.fire.dur; neckPitch += lerp(0.25, -0.14, smoothstep01((k - BREATH_CHARGE) / 0.25)); glide = Math.max(glide, 0.8); }
    if (k >= s.fire.dur + 0.4) s.fire.t = -1;
  }

  // wing beat: strong when climbing, gliding when diving or breathing fire
  const climb = clamp(T.y * 4 + 0.6, 0, 1);
  const ampTarget = clamp(lerp(0.25, 1.0, climb) + flapBoost * 0.6 - glide * 0.75, 0.12, 1.4);
  s.flapAmp = damp(s.flapAmp, ampTarget, 2, dt);
  s.flapPhase += dt * Math.PI * 2 * lerp(0.55, 0.95, s.flapAmp) * (1 + flapBoost * 0.5);
  const ph = s.flapPhase, wave = Math.sin(ph + 0.35 * Math.sin(ph));
  const u = rig.uniforms;
  u.uFlap.value = THREE.MathUtils.degToRad(6 + 38 * wave * s.flapAmp);
  u.uFlap2.value = THREE.MathUtils.degToRad(-4 + 26 * Math.sin(ph - 0.75) * s.flapAmp);
  u.uTime.value = s.t;
  u.uNeckPitch.value = damp(u.uNeckPitch.value, neckPitch, 8, dt);
  u.uNeckYaw.value = damp(u.uNeckYaw.value, neckYaw, 3, dt);
  u.uTailAmp.value = 0.1 + 0.06 * s.flapAmp;
  if (s.prevSin > 0.3 && wave <= 0.3 && s.flapAmp > 0.45) sound.flap(s.flapAmp);
  s.prevSin = wave;

  body.position.y = -Math.cos(ph) * 0.35 * s.flapAmp;
  body.rotation.set(pitch + Math.sin(ph) * 0.03 * s.flapAmp, 0, roll);

  // fire emission
  dragon.updateMatrixWorld(true);
  if (rig.ready) {
    deformPoint(rig.mouth, mouthLocal);
    mouthTip.copy(mouthLocal).add(tmpV.set(0, 0, rig.halfLen * 0.04));
    body.localToWorld(mouthW.copy(mouthTip));
    deformPoint(tmpV.copy(rig.mouth).add(tmpV2.set(0, -0.15, 1)), tmpV2);
    body.localToWorld(tmpV2);
    mouthDir.copy(tmpV2).sub(body.localToWorld(tmpV.copy(mouthLocal))).normalize();
    const vel = tmpV.copy(mouthW).sub(prevMouth).divideScalar(Math.max(dt, 1e-3));
    prevMouth.copy(mouthW);
    if (breathing) {
      const n = Math.floor(dt * 380 + Math.random());
      for (let i = 0; i < n; i++) {
        const spread = 0.11, dir = tmpV2.copy(mouthDir).add(new THREE.Vector3((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread)).normalize();
        const sp = 52 + Math.random() * 18;
        const v = dir.multiplyScalar(sp).addScaledVector(vel, 0.85);
        const start = mouthW.clone().addScaledVector(v, Math.random() * dt);
        flames.emit(start, v, 0.7 + Math.random() * 0.5, 0.7 + Math.random() * 0.6);
        if (Math.random() < 0.18) smoke.emit(start, v.clone().multiplyScalar(0.7), 1.6 + Math.random() * 0.8, 3 + Math.random() * 2);
        if (Math.random() < 0.12) sparks.emit(start, v.clone().multiplyScalar(0.6).add(new THREE.Vector3((Math.random() - 0.5) * 30, Math.random() * 18, (Math.random() - 0.5) * 30)), 1.2 + Math.random(), 0.18);
      }
      s.shake = Math.max(s.shake, 0.35);
    }
    const charge = s.fire.t >= 0 && s.fire.t < BREATH_CHARGE ? s.fire.t / BREATH_CHARGE : 0;
    const target = breathing ? 900 * (0.75 + 0.25 * Math.sin(s.t * 40) * Math.sin(s.t * 23)) : charge * 260;
    fireLight.intensity = damp(fireLight.intensity, target, 12, dt);
    fireLight.position.copy(mouthW).addScaledVector(mouthDir, 6);
    s.heat = damp(s.heat, breathing ? 1 : 0, 4, dt);
  }
  flames.update(dt, 1.7, 8, 160);
  smoke.update(dt, 1.2, 5);
  sparks.update(dt, 0.6, -6);

  // keep the shadow frustum centred on the dragon
  sun.target.position.copy(dragon.position);
  sun.position.copy(dragon.position).addScaledVector(SUN, 120);

  dragon.matrixWorld.extractBasis(Xd, Yd, Zd);
  Zf.set(Zd.x, 0, Zd.z).normalize();
  Xf.crossVectors(UP, Zf).normalize();
}

const controls = new OrbitControls(camera, canvas);
controls.enabled = false;
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 160;
const cam = { pos: new THREE.Vector3(), look: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0), fov: 50, fixed: new THREE.Vector3(), angle: 0 };
const flat = (x, y, z, out) => out.copy(dragon.position).addScaledVector(Xf, x).addScaledVector(UP, y).addScaledVector(Zf, z);
const full = (x, y, z, out) => out.copy(dragon.position).addScaledVector(Xd, x).addScaledVector(Yd, y).addScaledVector(Zd, z);
const desired = new THREE.Vector3(), desiredLook = new THREE.Vector3();
const L = () => MODEL.length;
const SHOTS = {
  wide: {
    name: 'Weitwinkel', dur: 8.5,
    enter() {
      const ahead = path.getPointAt((state.u + 0.05) % 1);
      const dir = tmpV.set(ahead.x, 0, ahead.z).normalize();
      cam.fixed.copy(dir).multiplyScalar(205).add(tmpV2.set(-dir.z * 40, 34, dir.x * 40));
      return true;
    },
    update() {
      desired.copy(cam.fixed);
      desiredLook.copy(dragon.position).lerp(tmpV.set(0, 6, 0), 0.4);
      cam.fov = 46; cam.k = 50; cam.lk = 4; cam.up.copy(UP);
    },
  },
  chase: {
    name: 'Verfolgung', dur: 8,
    update() { flat(3, 6.5, -L() * 1.55, desired); flat(0, 2.5, L() * 0.6, desiredLook); cam.fov = 52; cam.k = 2.8; cam.lk = 7; cam.up.copy(UP).lerp(Yd, 0.35).normalize(); },
  },
  side: {
    name: 'Seitenflug', dur: 8,
    update() { flat(-L() * 1.35, 2.2, L() * 0.2, desired); flat(0, 1, L() * 0.25, desiredLook); cam.fov = 46; cam.k = 3; cam.lk = 8; cam.up.copy(UP); },
  },
  hero: {
    name: 'Heldenperspektive', dur: 6.5,
    enter() {
      const u2 = (state.u + (state.speed * 3.4) / PATH_LEN) % 1;
      const P = path.getPointAt(u2), T = path.getTangentAt(u2);
      const side = tmpV.crossVectors(UP, T).normalize();
      cam.fixed.copy(P).addScaledVector(side, 13).addScaledVector(UP, -9);
      return true;
    },
    update() {
      desired.copy(cam.fixed);
      desiredLook.copy(dragon.position);
      const d = cam.fixed.distanceTo(dragon.position);
      cam.fov = clamp(THREE.MathUtils.radToDeg(2 * Math.atan((L() * 0.95) / d)), 20, 72);
      cam.k = 50; cam.lk = 9; cam.up.copy(UP);
    },
  },
  rider: {
    name: 'Reiterblick', dur: 8,
    update() {
      full(0, rig.rider.y + rig.height * 0.4, rig.rider.z - L() * 0.48, desired);
      full(0, rig.rider.y * 0.6, rig.rider.z + L() * 1.2, desiredLook);
      cam.fov = 64; cam.k = 12; cam.lk = 12; cam.up.copy(Yd);
    },
  },
  orbit: {
    name: 'Umkreisung', dur: 9,
    enter() { cam.angle = Math.atan2(camera.position.z - dragon.position.z, camera.position.x - dragon.position.x); return true; },
    update(dt) {
      cam.angle += dt * 0.32;
      desired.copy(dragon.position).add(tmpV.set(Math.cos(cam.angle) * L() * 1.35, 4 + Math.sin(state.t * 0.4) * 3, Math.sin(cam.angle) * L() * 1.35));
      desiredLook.copy(dragon.position);
      cam.fov = 48; cam.k = 5; cam.lk = 8; cam.up.copy(UP);
    },
  },
  front: {
    name: 'Frontal', dur: 7,
    update() { flat(-L() * 0.35, 2.5, L() * 1.5, desired); flat(0, 1.2, 0, desiredLook); cam.fov = 44; cam.k = 3; cam.lk = 8; cam.up.copy(UP); },
  },
};
const SEQUENCE = [
  ['wide', null], ['chase', [4.2, doRoll]], ['side', [2.0, doFire]], ['hero', null],
  ['rider', null], ['orbit', [3.0, doRoar]], ['front', [2.4, doFire]],
];
const director = { i: 0, t: 0, auto: true, free: false, acted: false };
const shotEl = document.getElementById('shot'), shotName = document.getElementById('shotName'), shotNo = document.getElementById('shotNo');
const dip = document.getElementById('dip');
function cut(i) {
  director.i = (i + SEQUENCE.length) % SEQUENCE.length;
  director.t = 0; director.acted = false;
  const shot = SHOTS[SEQUENCE[director.i][0]];
  if (shot.enter) shot.enter();
  shot.update(0);
  camera.position.copy(desired);
  cam.look.copy(desiredLook);
  camera.up.copy(cam.up);
  camera.fov = cam.fov;
  shotName.textContent = shot.name;
  shotNo.textContent = `Kamera ${director.i + 1} / ${SEQUENCE.length}`;
  shotEl.classList.remove('show'); void shotEl.offsetWidth; shotEl.classList.add('show');
  clearTimeout(cut.timer); cut.timer = setTimeout(() => shotEl.classList.remove('show'), 2600);
  if (!REDUCED) { dip.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => dip.classList.remove('on'))); }
}
function updateCamera(dt) {
  if (director.free) {
    tmpV.copy(dragon.position).sub(controls.target);
    camera.position.add(tmpV); controls.target.copy(dragon.position);
    camera.fov = damp(camera.fov, 50, 3, dt);
    controls.update();
  } else {
    const [key, action] = SEQUENCE[director.i], shot = SHOTS[key];
    director.t += dt;
    shot.update(dt);
    camera.position.lerp(desired, 1 - Math.exp(-cam.k * dt));
    cam.look.lerp(desiredLook, 1 - Math.exp(-cam.lk * dt));
    camera.up.lerp(cam.up, 1 - Math.exp(-5 * dt)).normalize();
    camera.fov = damp(camera.fov, cam.fov, 4, dt);
    camera.lookAt(cam.look);
    if (action && director.auto && !director.acted && director.t > action[0]) { director.acted = true; action[1](); }
    if (director.auto && director.t > shot.dur * (REDUCED ? 1.5 : 1)) cut(director.i + 1);
  }
  if (state.shake > 0 && !REDUCED) {
    const a = state.shake * 0.12;
    camera.rotation.x += (Math.random() - 0.5) * a * 0.1; camera.rotation.y += (Math.random() - 0.5) * a * 0.1;
    camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a;
  }
  state.shake = Math.max(0, state.shake - dt * 1.6);
  camera.updateProjectionMatrix();
}
function setFree(on) {
  director.free = on;
  controls.enabled = on;
  document.getElementById('bars').classList.toggle('off', on);
  const b = document.getElementById('bFree');
  b.setAttribute('aria-pressed', String(on));
  document.getElementById('bFreeLabel').textContent = on ? 'Kino' : 'Frei';
  if (on) { camera.up.copy(UP); controls.target.copy(dragon.position); shotEl.classList.remove('show'); }
  else cut(director.i);
}

  document.getElementById('bSound').setAttribute('aria-pressed', String(on));
};
canvas.addEventListener('pointerdown', () => { if (!director.free) setFree(true); }, { capture: true });
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = { f: 'bFire', r: 'bRoll', b: 'bRoar', c: 'bCam', o: 'bFree', m: 'bSound' };
  if (map[k]) { document.getElementById(map[k]).click(); e.preventDefault(); }
});
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  grade.uniforms.uRes.value.set(w * DPR, h * DPR);
}
addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
let frame = 0;
const fixedDt = params.has('fixed') ? parseFloat(params.get('fixed')) : 0;
function tick() {
  const dt = fixedDt || Math.min(clock.getDelta(), 1 / 20);
  state.t += dt;
  const t = state.t;
  if (!window.__freeze) { updateDragon(dt); updateCamera(dt); }
  sky.position.copy(camera.position);
  sky.material.uniforms.uTime.value = t;
  cloudSea.material.uniforms.uTime.value = t;
  clouds.mat.uniforms.uTime.value = t;
  if (frame % 15 === 0) clouds.sort(camera);
  waterfall.uniforms.uTime.value = t;
  debris(t);
  birds(t);
  streaks(dt, state.speed);
  const px = (innerHeight * DPR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const m of [flames.mat, smoke.mat, sparks.mat, dustMat, jadeMat]) { m.uniforms.uPx.value = px; m.uniforms.uTime.value = t; }
  glowing.forEach((g) => { g.crystal.rotation.y = t * 0.6; g.crystal.position.y = g.y + Math.sin(t * 1.3) * 0.5; g.runeMat.color.setRGB(0.25, 1.3 + 0.4 * Math.sin(t * 2), 1.1 + 0.35 * Math.sin(t * 2)); });
  grade.uniforms.uTime.value = t;
  grade.uniforms.uHeat.value = state.heat;
  state.flash = damp(state.flash, state.roar.t > 0.25 && state.roar.t < 0.45 && !REDUCED ? 0.12 : 0, 10, dt);
  grade.uniforms.uFlash.value = state.flash;
  if (sound.on) {
    sound.windGain.gain.setTargetAtTime(0.18 + (state.speed - 20) * 0.012, sound.ctx.currentTime, 0.3);
    sound.windFilter.frequency.setTargetAtTime(300 + state.speed * 12, sound.ctx.currentTime, 0.3);
  }
  composer.render(dt);
  frame++;
}
renderer.setAnimationLoop(tick);
window.__dbg = { THREE, scene, camera, controls, dragon, body, state, director, rig, sky, cloudSea, clouds, cut, SHOTS, setFree, doFire, doRoll, doRoar, updateDragon, updateCamera };

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
const loaderEl = document.getElementById('loader'), statusEl = document.getElementById('status'), barEl = document.getElementById('bar');
statusEl.textContent = 'Lade den Drachen …';
loadDragon((e) => {
  if (e.total) { const k = e.loaded / e.total; barEl.style.width = `${Math.round(k * 100)}%`; statusEl.textContent = `Lade den Drachen … ${Math.round(k * 100)} %`; }
}).then(() => {
  barEl.style.width = '100%';
  if (params.has('shot')) { director.auto = false; cut(SEQUENCE.findIndex(([k]) => k === params.get('shot'))); }
  else cut(0);
  if (params.has('t')) { const n = Math.round(parseFloat(params.get('t')) * 30); for (let i = 0; i < n; i++) { state.t += 1 / 30; updateDragon(1 / 30); updateCamera(1 / 30); } }
  if (params.has('act')) ({ fire: doFire, roll: doRoll, roar: doRoar })[params.get('act')]?.();
  setTimeout(() => loaderEl.classList.add('done'), 400);
  window.__ready = true;
}).catch((err) => {
  console.error(err);
  cut(0);
  loaderEl.querySelector('.loader-inner').classList.add('err');
  statusEl.innerHTML = 'Das Drachenmodell <code>assets/dragon.glb</code> fehlt noch. Erzeuge es mit <code>generate_meshy.py</code> und <code>optimize.sh</code>.';
  window.__ready = true;
});
</script>
